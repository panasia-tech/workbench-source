<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>闲鱼网页聊天 · 内嵌采购 Copilot v5.0 实机预览</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #f3f4f6;
      color: #111827;
      font: 13.5px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      font-variant-numeric: tabular-nums;
    }
    .preview-banner {
      height: 44px;
      background: #111827;
      color: #fff;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 13px;
    }
    .preview-banner .pill {
      background: #ffda00;
      color: #111827;
      font-weight: 900;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      margin-right: 8px;
    }
    .preview-banner a {
      color: #111827;
      background: #ffda00;
      text-decoration: none;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 12.5px;
    }
    .stage {
      height: calc(100vh - 44px);
      padding: 12px;
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr) 372px;
      gap: 12px;
    }
    .gf-left, .gf-chat, .copilot-frame {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }
    .gf-left {
      display: flex;
      flex-direction: column;
    }
    .flt-bar {
      padding: 12px 12px 10px;
      border-bottom: 1px solid #e5e7eb;
    }
    .flt-hd {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .flt-hd span { color: #6b7280; font-weight: 600; }
    .pills { display: flex; flex-wrap: wrap; gap: 5px; }
    .pills button {
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      color: #374151;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .pills button.on {
      background: #111827;
      color: #fff;
      border-color: #111827;
    }
    .conv-list {
      padding: 8px;
      display: grid;
      gap: 6px;
      overflow-y: auto;
    }
    .conv-row {
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) 50px;
      gap: 9px;
      align-items: center;
      padding: 9px 10px;
      border-radius: 12px;
      border: 1.5px solid transparent;
      cursor: pointer;
    }
    .conv-row:hover { background: #f9fafb; }
    .conv-row.on { background: #eff6ff; border-color: #2563eb; }
    .av {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #ffda00;
      color: #111827;
      font-weight: 900;
      display: grid;
      place-items: center;
    }
    .thumb50 {
      width: 50px;
      height: 50px;
      border-radius: 9px;
      object-fit: cover;
      border: 1px solid #e5e7eb;
    }
    .wait-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 11px;
      font-weight: 700;
    }
    .wait-badge.hot { background: #fef2f2; color: #b91c1c; }

    .gf-chat {
      display: grid;
      grid-template-rows: auto 1fr auto;
    }
    .top-strip {
      padding: 11px 16px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .metrics {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }
    .metrics .k { display: block; font-size: 11px; color: #6b7280; font-weight: 600; }
    .metrics .v { font-size: 15px; font-weight: 900; }
    .btn-ylw {
      border: 1px solid #f0cb00;
      background: #ffda00;
      color: #111827;
      font-weight: 800;
      padding: 7px 12px;
      border-radius: 9px;
      font-size: 12.5px;
      cursor: pointer;
    }
    .msgs {
      padding: 18px;
      background: #f9fafb;
      display: grid;
      gap: 12px;
      align-content: start;
      overflow-y: auto;
    }
    .bub {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 14px;
      background: #fff;
      border: 1px solid #e5e7eb;
    }
    .bub.me {
      justify-self: end;
      background: #fef9c3;
      border-color: #fde047;
    }
    .composer {
      padding: 12px 16px;
      border-top: 1px solid #e5e7eb;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
    }
    .composer input {
      height: 40px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      padding: 0 12px;
      font: inherit;
    }
    .composer button {
      height: 40px;
      padding: 0 18px;
      border: 0;
      border-radius: 10px;
      background: #111827;
      color: #fff;
      font-weight: 800;
      cursor: pointer;
    }
    .leak-alert {
      margin: 0 16px 10px;
      padding: 9px 12px;
      border-radius: 10px;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #dc2626;
      font-size: 12.5px;
      font-weight: 700;
      display: none;
    }
    .copilot-frame iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <header class="preview-banner">
    <div>
      <span class="pill">AdsPower 内嵌插件实机预览 · v5.0</span>
      <span>左侧原生头像与右侧 50px 商品图零遮挡 · 顶部快照大图灯箱 · 右侧平行四 Dock 面板</span>
    </div>
    <a href="./#/today">← 返回 7 模块单独页面版工作台</a>
  </header>

  <div class="stage">
    <!-- 左栏：闲鱼原生会话列表 + 5维筛选胶囊 + 实时等待读秒 + 右侧50px商品图 -->
    <aside class="gf-left">
      <div class="flt-bar">
        <div class="flt-hd"><b>采购筛选</b><span>1小时内含前10分钟</span></div>
        <div class="pills" id="flt-pills">
          <button type="button" class="on" data-k="all">全部</button>
          <button type="button" data-k="10m">10分钟内</button>
          <button type="button" data-k="1h">1小时内</button>
          <button type="button" data-k="slow">慢慢压价</button>
          <button type="button" data-k="fav">★ 收藏</button>
        </div>
      </div>
      <div class="conv-list" id="conv-list"></div>
    </aside>

    <!-- 中栏：闲鱼原生聊天区 + 顶部参考与快照大图条 -->
    <main class="gf-chat">
      <div class="top-strip">
        <div class="metrics">
          <div><span class="k">公司冻结参考价</span><span class="v" id="top-ref">¥5,050</span></div>
          <div><span class="k">最高出价上限</span><span class="v" style="color:#2563eb" id="top-ceil">¥4,750</span></div>
          <div><span class="k">买前10%预计提成</span><span class="v" style="color:#059669" id="top-comm">¥43</span></div>
        </div>
        <button type="button" class="btn-ylw" id="btn-open-lb">🔍 查看商品快照大图</button>
      </div>
      <div class="msgs" id="msg-box"></div>
      <div>
        <div class="leak-alert" id="leak-alert"></div>
        <div class="composer">
          <input id="gf-input" placeholder="点击右侧 Copilot 话术自动填入，或手动输入（自动拦截底价/微信号等敏感词）…" />
          <button type="button" id="gf-send">发送</button>
        </div>
      </div>
    </main>

    <!-- 右栏：平行不遮挡的内嵌 Copilot v5.0 真实侧边栏 -->
    <aside class="copilot-frame">
      <iframe id="cp-iframe" src="./copilot-ext/sidebar.html" title="采购 Copilot v5.0"></iframe>
    </aside>
  </div>

  <script src="./copilot-ext/snapshot-ui.js"></script>
  <script>
    const LEAK_WORDS = ['目标价','参考价','公司底价','底价','提成','毛利','最高上限','到手刀','二次议价','加微信','微信号','退差价'];
    let dashData = null;
    let curFilter = 'all';
    let selectedConv = 'CONV-001';
    let secTick = 0;

    async function initPreview() {
      const r = await fetch('./api/dashboard');
      const j = await r.json();
      dashData = j.data;
      renderConvs();
      renderChat();
    }

    function renderConvs() {
      if (!dashData) return;
      const box = document.getElementById('conv-list');
      const list = dashData.conversations.filter((c) => {
        if (curFilter === '10m') return c.idle_minutes <= 10 && !c.slow_group;
        if (curFilter === '1h') return c.idle_minutes <= 60 && !c.slow_group;
        if (curFilter === 'slow') return Number(c.slow_group) === 1;
        if (curFilter === 'fav') return Boolean(c.is_favorite_seller);
        return true;
      });
      box.innerHTML = list.map((c) => {
        const img = (c.item_snapshot?.images?.[0] || c.evidence_urls?.[0] || './evidence/IMG_5878.PNG');
        const waitS = c.wait_seconds ? c.wait_seconds + secTick : 0;
        return `
          <div class="conv-row ${c.conv_id === selectedConv ? 'on' : ''}" data-cid="${c.conv_id}">
            <div class="av">${c.seller_name.slice(0,1)}</div>
            <div style="min-width:0">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:4px">
                <b style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.is_favorite_seller ? '★ ' : ''}${c.seller_name}</b>
                ${waitS > 0 ? `<span class="wait-badge ${waitS >= 60 ? 'hot' : ''}">等待 ${waitS}秒</span>` : ''}
              </div>
              <div style="font-size:12px;color:#4b5563;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.title}</div>
            </div>
            <img class="thumb50" src="${img}" alt="商品图" />
          </div>
        `;
      }).join('');
      box.querySelectorAll('.conv-row').forEach((el) => {
        el.addEventListener('click', () => {
          selectedConv = el.getAttribute('data-cid');
          renderConvs();
          renderChat();
        });
      });
    }

    function renderChat() {
      if (!dashData) return;
      const cv = dashData.conversations.find((c) => c.conv_id === selectedConv) || dashData.conversations[0];
      if (!cv) return;
      const msgs = dashData.messages.filter((m) => m.conv_id === cv.conv_id);
      document.getElementById('msg-box').innerHTML = msgs.map((m) => `
        <div class="bub ${m.sender.startsWith('buyer') ? 'me' : ''}">
          <div style="font-size:11.5px;color:#6b7280;margin-bottom:3px"><b>${m.sender_label}</b></div>
          <div>${m.text}</div>
        </div>
      `).join('');
      if (cv.item_snapshot && window.__pcSnapshotUI) {
        window.__pcSnapshotUI.setSnapshot(cv.item_snapshot);
      }
    }

    document.querySelectorAll('#flt-pills button').forEach((b) => {
      b.addEventListener('click', () => {
        document.querySelectorAll('#flt-pills button').forEach((x) => x.classList.remove('on'));
        b.classList.add('on');
        curFilter = b.getAttribute('data-k');
        renderConvs();
      });
    });

    document.getElementById('btn-open-lb').addEventListener('click', () => {
      window.__pcSnapshotUI?.openLightbox();
    });

    const gfIn = document.getElementById('gf-input');
    const leakEl = document.getElementById('leak-alert');
    function checkLeak() {
      const hit = LEAK_WORDS.find((w) => gfIn.value.includes(w));
      if (hit) {
        leakEl.style.display = 'block';
        leakEl.textContent = `🛑 防泄密/防封号拦截：检测到敏感词「${hit}」，请删除后再发！`;
      } else {
        leakEl.style.display = 'none';
      }
    }
    gfIn.addEventListener('input', checkLeak);

    window.addEventListener('message', (e) => {
      const { type, payload } = e.data || {};
      if (type === 'FILL_GOOFISH_INPUT' && payload?.text) {
        gfIn.value = payload.text;
        checkLeak();
      } else if (type === 'SYNC_CEILING' && payload) {
        if (payload.refPriceText) document.getElementById('top-ref').textContent = payload.refPriceText;
        if (payload.ceilingText) document.getElementById('top-ceil').textContent = payload.ceilingText;
        if (payload.preCommText) document.getElementById('top-comm').textContent = payload.preCommText;
        if (payload.snapshot && window.__pcSnapshotUI) window.__pcSnapshotUI.setSnapshot(payload.snapshot);
      } else if (type === 'OPEN_SNAPSHOT_MODAL') {
        window.__pcSnapshotUI?.openLightbox(payload?.snapshot);
      }
    });

    setInterval(() => {
      secTick += 1;
      renderConvs();
    }, 1000);

    initPreview();
  </script>
</body>
</html>
