[project]
name = "media-service"
version = "0.1.0"
description = "公司宣发与培训资料服务：固定链接、按受众校验、私有 OSS 签名播放、版本切换与回退。"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "oss2==2.19.1",
  "pydantic-settings==2.10.1",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "ruff==0.12.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP017"]
