services:
  emqx:
    image: emqx/emqx:5.8.6
    container_name: gc-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"     # MQTT
      - "8883:8883"     # MQTT over TLS（生产用）
      - "18083:18083"   # Dashboard（默认 admin/public）
    volumes:
      - ./emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - gc-emqx-data:/opt/emqx/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  gc-emqx-data:
