# 本地开发用 MQTT broker(mosquitto)配置。
# 仅 dev:开匿名、不做鉴权,替代生产 EMQX(EMQX 跑在腾讯云生产机 127.0.0.1,带 HTTP auth/acl 钩子)。
# 起:/usr/local/opt/mosquitto/sbin/mosquitto -c docker/mosquitto-dev.conf
listener 1883 0.0.0.0
allow_anonymous true
# 原语截图 base64 帧较大,放宽单包上限到 5MB(EMQX 生产同样需调大)
max_packet_size 5242880
persistence false
log_type warning
