## 群控 EMQX 配置（自建）。鉴权/ACL 走后端 HTTP 钩子。
## 生产：加 TLS 监听 8883、改 dashboard 默认口令、data_dir 落盘卷。

node {
  name = "emqx@127.0.0.1"
  cookie = "gc-emqx-cookie"
  data_dir = "data"
}

dashboard {
  listeners.http { bind = 18083 }
}

listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 1024000
}

## 原语截图 base64 帧较大(JPEG q60 一般 100~400KB,高细节屏可能更大),默认 1MB 会断连,放宽到 5MB
mqtt {
  max_packet_size = 5MB
}

## 认证：HTTP 钩子 → 后端 /mqtt/auth（后端在宿主机 8100）
authentication = [
  {
    mechanism = password_based
    backend = http
    enable = true
    method = post
    url = "http://host.docker.internal:8100/mqtt/auth"
    headers { "content-type" = "application/json" }
    body {
      clientid = "${clientid}"
      username = "${username}"
      password = "DEMO_ONLY_REDACTED"
    }
  }
]

## 授权：HTTP 钩子 → 后端 /mqtt/acl，无匹配一律拒绝
authorization {
  no_match = deny
  deny_action = ignore
  sources = [
    {
      type = http
      enable = true
      method = post
      url = "http://host.docker.internal:8100/mqtt/acl"
      headers { "content-type" = "application/json" }
      body {
        clientid = "${clientid}"
        username = "${username}"
        topic = "${topic}"
        action = "${action}"
      }
    }
  ]
}
