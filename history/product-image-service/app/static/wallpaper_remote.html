<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1110">
  <title>小影 · 手机取景</title>
  <style>
    :root {
      color-scheme: dark;
      --night: #0d1110;
      --panel: #171d1b;
      --panel-raised: #1d2522;
      --line: rgba(255, 255, 255, .12);
      --ink: #f7f3ed;
      --muted: #a5aaa5;
      --mint: #a7e6d7;
      --coral: #ffad78;
      --danger: #ff9b9d;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100dvh;
      margin: 0;
      padding: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      background: radial-gradient(circle at 50% -15%, #2a3833 0, var(--night) 52%);
      color: var(--ink);
    }
    main { width: min(100%, 560px); margin: 0 auto; }
    .shell {
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 26px;
      background: rgba(23, 29, 27, .9);
      box-shadow: 0 26px 80px rgba(0, 0, 0, .28);
    }
    .assistant-head { display: flex; align-items: center; gap: 11px; padding: 2px 2px 14px; }
    .avatar {
      position: relative;
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(167, 230, 215, .46);
      border-radius: 15px;
      background: rgba(167, 230, 215, .13);
      box-shadow: inset 0 0 0 5px rgba(167, 230, 215, .04);
    }
    .avatar::before {
      position: absolute;
      top: 15px;
      left: 12px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 13px 0 0 var(--mint);
      content: "";
    }
    .avatar::after {
      position: absolute;
      left: 15px;
      bottom: 10px;
      width: 12px;
      height: 5px;
      border-bottom: 1.5px solid var(--mint);
      border-radius: 0 0 12px 12px;
      content: "";
    }
    .assistant-copy strong, .assistant-copy span { display: block; }
    .assistant-copy strong { font-size: 15px; font-weight: 760; letter-spacing: -.02em; }
    .assistant-copy span { margin-top: 4px; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .camera-card { overflow: hidden; border: 1px solid rgba(255, 255, 255, .14); border-radius: 20px; background: #060807; }
    .camera-stage { position: relative; display: grid; place-items: center; aspect-ratio: 4 / 3; min-height: 250px; overflow: hidden; }
    .camera-stage video { display: none; width: 100%; height: 100%; background: #050706; object-fit: contain; }
    .camera-card.active .camera-stage video { display: block; }
    .placeholder { display: grid; justify-items: center; gap: 9px; padding: 26px; text-align: center; }
    .camera-card.active .placeholder { display: none; }
    .placeholder-mark { display: grid; place-items: center; width: 60px; height: 60px; border: 1px solid rgba(255, 173, 120, .44); border-radius: 20px; color: var(--coral); font-size: 25px; }
    .placeholder-mark::before { content: "⌾"; transform: translateY(-1px); }
    .placeholder strong { font-size: 15px; font-weight: 710; }
    .placeholder span { max-width: 260px; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .live-pill { position: absolute; top: 12px; left: 12px; min-height: 26px; padding: 5px 9px; border: 1px solid rgba(255, 255, 255, .15); border-radius: 999px; background: rgba(8, 11, 10, .68); color: var(--muted); font-size: 11px; font-weight: 700; backdrop-filter: blur(8px); }
    .camera-card.active .live-pill { color: var(--mint); border-color: rgba(167, 230, 215, .35); }
    .frame-progress { position: absolute; right: 12px; bottom: 12px; left: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 10px; border: 1px solid rgba(255, 255, 255, .13); border-radius: 11px; background: rgba(8, 11, 10, .72); color: var(--muted); font-size: 11px; backdrop-filter: blur(8px); }
    .frame-progress strong { color: var(--ink); font-variant-numeric: tabular-nums; }
    .controls { margin-top: 14px; padding: 15px; border: 1px solid rgba(255, 255, 255, .09); border-radius: 18px; background: rgba(29, 37, 34, .72); }
    .section-title { margin-bottom: 9px; color: var(--muted); font-size: 11px; font-weight: 760; letter-spacing: .08em; }
    .pair-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
    input { width: 100%; min-height: 48px; padding: 0 13px; border: 1px solid var(--line); border-radius: 11px; outline: 0; background: #101513; color: var(--ink); font-size: 21px; font-weight: 800; letter-spacing: .2em; text-align: center; font-variant-numeric: tabular-nums; }
    input:focus { border-color: var(--mint); box-shadow: 0 0 0 4px rgba(167, 230, 215, .1); }
    button { min-height: 48px; padding: 0 17px; border: 1px solid var(--mint); border-radius: 11px; background: var(--mint); color: #13201d; font: inherit; font-weight: 800; transition: transform 140ms ease-out, opacity 140ms ease-out; }
    button:active { transform: scale(.97); }
    button:disabled { cursor: not-allowed; opacity: .42; }
    .start { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 62px; margin-top: 11px; padding: 0 17px; border-color: var(--coral); background: var(--coral); color: #2c170b; text-align: left; }
    .start span { font-size: 17px; font-weight: 850; }
    .start small { font-size: 11px; font-weight: 750; opacity: .8; }
    .status { min-height: 22px; margin: 13px 2px 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
    .status.ready { color: var(--mint); }
    .status.error { color: var(--danger); }
    .status.busy { color: var(--coral); }
    .result { display: none; margin-top: 13px; padding: 13px; border: 1px solid rgba(167, 230, 215, .3); border-radius: 14px; background: rgba(167, 230, 215, .07); }
    .result.active { display: block; }
    .result strong, .result span { display: block; }
    .result strong { color: var(--mint); font-size: 14px; }
    .result span { margin-top: 4px; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .download { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; margin-top: 10px; padding: 0 13px; border: 1px solid var(--mint); border-radius: 9px; color: var(--mint); font-size: 12px; font-weight: 800; text-decoration: none; }
    .tip { margin: 13px 2px 0; color: var(--muted); font-size: 11px; line-height: 1.55; }
    .hidden { position: fixed; left: -10000px; top: -10000px; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @media (max-width: 380px) {
      .shell { padding: 12px; border-radius: 22px; }
      .camera-stage { min-height: 220px; }
      .start small { display: none; }
    }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <main>
    <section class="shell">
      <header class="assistant-head">
        <div class="avatar" aria-hidden="true"></div>
        <div class="assistant-copy"><strong>你好，我来帮你收好这 10 秒画面</strong><span id="helper">先连上电脑，再把手机对准显示器。</span></div>
      </header>
      <section id="camera-card" class="camera-card" aria-label="手机摄像头画面">
        <div class="camera-stage">
          <div id="camera-placeholder" class="placeholder"><div class="placeholder-mark" aria-hidden="true"></div><strong>我在等你把镜头对准电脑</strong><span>连接后点击开始，我会边录像边收下 100 个画面。</span></div>
          <video id="camera" autoplay playsinline muted></video>
          <div id="live-pill" class="live-pill">等待相机</div>
          <div class="frame-progress"><strong id="frame-count">未开始</strong><span>每 0.1 秒一张</span></div>
        </div>
      </section>
      <section class="controls">
        <div class="section-title">和电脑碰个头</div>
        <div class="pair-row"><label class="sr-only" for="code">电脑配对码</label><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"><button id="connect" type="button">连接</button></div>
        <button id="start" class="start" type="button" disabled><span>开始录像</span><small>10 秒 · 自动切出 100 张图片</small></button>
        <div id="status" class="status" role="status">我在等你输入配对码</div>
      </section>
      <div id="result" class="result"><strong id="result-title">切片完成</strong><span id="result-copy"></span><a id="download" class="download" download>下载 100 张图片 ZIP</a></div>
      <div class="tip">手机负责取景、录像和切片；电脑只负责全屏播放。首次点击开始时，请允许 Safari 使用摄像头。</div>
    </section>
    <canvas id="slice-canvas" class="hidden"></canvas>
  </main>
  <script src="/wallpaper/vendor/fflate.min.js"></script>
  <script>
    (() => {
      const FRAME_COUNT = 100;
      const FRAME_MS = 100;
      const DURATION_MS = FRAME_COUNT * FRAME_MS;
      const el = {
        code: document.getElementById('code'), connect: document.getElementById('connect'), start: document.getElementById('start'),
        helper: document.getElementById('helper'), status: document.getElementById('status'), cameraCard: document.getElementById('camera-card'),
        camera: document.getElementById('camera'), livePill: document.getElementById('live-pill'), frameCount: document.getElementById('frame-count'),
        result: document.getElementById('result'), resultTitle: document.getElementById('result-title'), resultCopy: document.getElementById('result-copy'),
        download: document.getElementById('download'), canvas: document.getElementById('slice-canvas'),
      };
      const state = {
        socket: null, connected: false, stream: null, recorder: null, chunks: [], recording: false,
        startTimer: 0, stopTimer: 0, captureRaf: 0, captureStartedAt: 0, captureIndex: 0,
        framePromises: [], frameBlobs: [], finalizing: false, pendingMimeType: '', downloadUrl: '',
      };

      const setStatus = (message, type = '') => { el.status.textContent = message; el.status.className = `status ${type}`; };
      const setHelper = (message) => { el.helper.textContent = message; };
      const setCameraState = (message) => { el.livePill.textContent = message; };
      const isCameraAvailable = () => Boolean(navigator.mediaDevices?.getUserMedia);
      const socketUrl = () => {
        const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
        return `${protocol}://${window.location.host}/v1/wallpaper/player/ws?code=${encodeURIComponent(el.code.value.trim())}&role=remote`;
      };

      function waitForEvent(target, eventName, timeoutMs = 5000) {
        return new Promise((resolve, reject) => {
          let timer = 0;
          const done = (callback, value) => { window.clearTimeout(timer); target.removeEventListener(eventName, onEvent); callback(value); };
          const onEvent = () => done(resolve);
          target.addEventListener(eventName, onEvent, {once: true});
          timer = window.setTimeout(() => done(reject, new Error('摄像头画面加载超时')), timeoutMs);
        });
      }

      function recorderMimeType() {
        if (!window.MediaRecorder?.isTypeSupported) return '';
        const types = ['video/mp4', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
        return types.find((type) => MediaRecorder.isTypeSupported(type)) || '';
      }

      async function openCamera() {
        if (!isCameraAvailable()) {
          throw new Error(window.isSecureContext ? '当前浏览器不支持手机摄像头' : '手机摄像头需要 HTTPS 安全地址，请用 HTTPS 打开此页面');
        }
        if (state.stream) return state.stream;
        state.stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {facingMode: {ideal: 'environment'}, width: {ideal: 1920}, height: {ideal: 1080}},
        });
        el.camera.srcObject = state.stream;
        el.cameraCard.classList.add('active');
        await el.camera.play().catch(() => {});
        if (!el.camera.videoWidth) await waitForEvent(el.camera, 'loadedmetadata', 5000);
        setCameraState('相机已打开');
        setHelper('我已经看见画面了，点开始后请尽量保持手机不动。');
        return state.stream;
      }

      function prepareRecorder() {
        state.chunks = [];
        state.recorder = null;
        const mimeType = recorderMimeType();
        if (!mimeType) return '';
        state.recorder = new MediaRecorder(state.stream, {mimeType});
        state.recorder.ondataavailable = (event) => { if (event.data?.size) state.chunks.push(event.data); };
        state.recorder.onerror = () => { state.recorder = null; setHelper('录像组件有点小脾气，但我会继续保存实时画面。'); };
        return mimeType;
      }

      function cameraDimensions() {
        const width = el.camera.videoWidth || 1280;
        const height = el.camera.videoHeight || 720;
        return {width, height};
      }

      function captureFrame(index) {
        const {width, height} = cameraDimensions();
        if (!el.camera.videoWidth || !el.camera.videoHeight) return Promise.reject(new Error('还没有拿到摄像头画面'));
        if (el.canvas.width !== width || el.canvas.height !== height) { el.canvas.width = width; el.canvas.height = height; }
        const context = el.canvas.getContext('2d', {alpha: false});
        context.drawImage(el.camera, 0, 0, width, height);
        return new Promise((resolve, reject) => {
          el.canvas.toBlob((blob) => {
            if (!blob) { reject(new Error(`第 ${index + 1} 张图片生成失败`)); return; }
            state.frameBlobs[index] = blob;
            resolve();
          }, 'image/jpeg', .92);
        });
      }

      function queueCurrentFrame() {
        const index = state.captureIndex;
        state.captureIndex += 1;
        state.framePromises.push(captureFrame(index));
        const progress = index + 1;
        el.frameCount.textContent = `${progress} / ${FRAME_COUNT}`;
        setCameraState(`正在收图 ${progress}/${FRAME_COUNT}`);
        if (index === 0 || progress % 5 === 0 || progress === FRAME_COUNT) setStatus(`我正在收第 ${progress} 张画面…`, 'busy');
      }

      async function completeCapture() {
        if (state.finalizing) return;
        state.finalizing = true;
        state.recording = false;
        window.clearTimeout(state.stopTimer);
        if (state.captureRaf) window.cancelAnimationFrame(state.captureRaf);
        if (state.recorder?.state === 'recording') { try { state.recorder.stop(); } catch (_) {} }
        setCameraState('画面收齐了');
        setHelper('我收到了，正在把 100 张图片整理成一个 ZIP。');
        setStatus('画面收齐了，正在整理 100 张图片…', 'busy');
        try {
          await Promise.all(state.framePromises);
          if (!window.fflate?.zipSync) throw new Error('切片组件未加载');
          const files = {};
          for (let index = 0; index < FRAME_COUNT; index += 1) {
            const blob = state.frameBlobs[index];
            if (!blob) throw new Error(`第 ${index + 1} 张图片生成失败`);
            files[`frame-${String(index + 1).padStart(3, '0')}.jpg`] = new Uint8Array(await blob.arrayBuffer());
          }
          const zipped = window.fflate.zipSync(files, {level: 0});
          const zipBlob = new Blob([zipped], {type: 'application/zip'});
          if (state.downloadUrl) URL.revokeObjectURL(state.downloadUrl);
          state.downloadUrl = URL.createObjectURL(zipBlob);
          el.download.href = state.downloadUrl;
          el.download.download = `wallpaper-frames-${new Date().toISOString().replace(/[:.]/g, '-')}.zip`;
          const {width, height} = cameraDimensions();
          el.resultTitle.textContent = '收好了 · 100 张图片';
          el.resultCopy.textContent = `每张都是 ${width}×${height} 的 JPEG，已打包为 ${(zipBlob.size / 1024 / 1024).toFixed(1)} MB ZIP。`;
          el.result.classList.add('active');
          setHelper('完成啦，下载 ZIP 后就能交给配套软件识别。');
          setStatus('录像和切片完成，可以下载 ZIP', 'ready');
        } catch (error) {
          setHelper('这次没有收完整，我可以再试一次。');
          setStatus(`切片失败：${error.message}`, 'error');
        } finally {
          state.finalizing = false;
          el.start.disabled = !state.connected;
        }
      }

      function scheduleRecording(startAtMs) {
        const delay = Math.max(0, Number(startAtMs || Date.now()) - Date.now());
        window.clearTimeout(state.startTimer);
        window.clearTimeout(state.stopTimer);
        state.startTimer = window.setTimeout(() => {
          state.startTimer = 0;
          if (state.recording) return;
          try {
            if (state.recorder) state.recorder.start(100);
          } catch (_) {
            state.recorder = null;
          }
          state.recording = true;
          state.finalizing = false;
          state.captureIndex = 0;
          state.frameBlobs = [];
          state.framePromises = [];
          state.captureStartedAt = performance.now();
          setCameraState('正在录像');
          setHelper('我在录，保持手机对准屏幕就好。');
          setStatus('正在录像 10 秒，请保持手机对准电脑画面…', 'busy');
          const tick = () => {
            if (!state.recording || state.finalizing) return;
            const elapsed = performance.now() - state.captureStartedAt;
            while (state.captureIndex < FRAME_COUNT && elapsed >= state.captureIndex * FRAME_MS + FRAME_MS / 2) queueCurrentFrame();
            if (state.captureIndex >= FRAME_COUNT) { completeCapture(); return; }
            state.captureRaf = window.requestAnimationFrame(tick);
          };
          state.captureRaf = window.requestAnimationFrame(tick);
          state.stopTimer = window.setTimeout(() => {
            if (!state.recording || state.finalizing) return;
            while (state.captureIndex < FRAME_COUNT) queueCurrentFrame();
            completeCapture();
          }, DURATION_MS + 500);
        }, delay);
      }

      function connectRemote() {
        const value = el.code.value.trim();
        if (!/^\d{6}$/.test(value)) { setStatus('请输入 6 位配对码', 'error'); return; }
        window.clearTimeout(state.startTimer);
        state.connected = false;
        el.connect.disabled = true;
        setStatus('正在连接电脑…');
        setHelper('我在找电脑页面，请稍等一下。');
        const socket = new WebSocket(socketUrl());
        state.socket = socket;
        socket.onopen = () => setStatus('链接打开了，等待电脑页面', 'ready');
        socket.onmessage = (event) => {
          let payload = {};
          try { payload = JSON.parse(event.data); } catch (_) { return; }
          if (payload.type === 'connected') return;
          if (payload.type === 'peer_connected' && payload.role === 'display') {
            state.connected = true;
            el.start.disabled = false;
            setHelper('电脑已经在等你了，准备好就点开始。');
            setStatus('已连接，点击开始录像', 'ready');
            return;
          }
          if (payload.type === 'recording_started') { scheduleRecording(payload.start_at_ms); return; }
          if (payload.type === 'playback_done') {
            if (state.recording) setStatus('电脑播放完成，我正在收最后几张…', 'busy');
            return;
          }
          if (payload.type === 'peer_disconnected') {
            state.connected = false;
            el.start.disabled = true;
            setHelper('电脑页面断开了，重新打开配对页面就好。');
            setStatus('电脑已断开', 'error');
            return;
          }
          if (payload.type === 'error') { el.start.disabled = !state.connected; setStatus(payload.message || '控制失败', 'error'); }
        };
        socket.onerror = () => { state.connected = false; el.start.disabled = true; setHelper('我没有找到电脑，请检查两台设备在同一个 Wi-Fi。'); setStatus('连接失败，请检查配对码和网络', 'error'); };
        socket.onclose = () => { el.connect.disabled = false; if (!state.connected) { el.start.disabled = true; setStatus('连接已关闭'); } };
      }

      async function startCapture() {
        if (!state.connected || state.recording || state.startTimer) return;
        el.start.disabled = true;
        el.result.classList.remove('active');
        el.frameCount.textContent = '准备中';
        try {
          await openCamera();
          state.pendingMimeType = prepareRecorder();
          if (state.socket?.readyState !== WebSocket.OPEN) throw new Error('电脑连接已断开');
          state.socket.send(JSON.stringify({type: 'start_recording'}));
          setStatus('相机准备好了，等电脑一起开始…', 'busy');
        } catch (error) {
          el.start.disabled = false;
          setStatus(error.message || '无法开始录像', 'error');
        }
      }

      el.connect.addEventListener('click', connectRemote);
      el.code.addEventListener('keydown', (event) => { if (event.key === 'Enter') connectRemote(); });
      el.start.addEventListener('click', startCapture);
      window.addEventListener('pagehide', () => {
        window.clearTimeout(state.startTimer);
        window.clearTimeout(state.stopTimer);
        if (state.captureRaf) window.cancelAnimationFrame(state.captureRaf);
        try { state.stream?.getTracks().forEach((track) => track.stop()); } catch (_) {}
        if (state.downloadUrl) URL.revokeObjectURL(state.downloadUrl);
      });
      const preset = new URLSearchParams(window.location.search).get('code');
      if (preset) el.code.value = preset.replace(/\D/g, '').slice(0, 6);
      if (!isCameraAvailable()) setStatus(window.isSecureContext ? '浏览器不支持手机摄像头' : '请使用 HTTPS 地址后再开始录像', 'error');
    })();
  </script>
</body>
</html>
